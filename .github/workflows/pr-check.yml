name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # sdkmanager and the cache path below both rely on it; this is the
      # preinstalled path on GitHub-hosted runners
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/build-cache-*
          key: gradle-builds-${{ github.sha }}
          restore-keys: gradle-builds-

      - name: Read NDK version
        id: ndk
        run: |
          set -euo pipefail
          # The libcxx prefab is published per NDK version, and ndkVersion in
          # app/build.gradle.kts reads this very same catalog entry
          version="$(sed -n 's/^libcxx[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          if [[ -z "$version" ]]; then
            echo "libcxx version not found in gradle/libs.versions.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install Android NDK ${{ steps.ndk.outputs.version }}
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          "$sdkmanager" --install "ndk;${{ steps.ndk.outputs.version }}"
          ls -d "$ANDROID_SDK_ROOT/ndk/${{ steps.ndk.outputs.version }}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew clean assembleDebug

      - name: Collect APKs
        run: |
          set -euxo pipefail
          mkdir -p out
          find app/build/outputs/apk -type f -name "*.apk" | sort > out/apk-list.txt
          cat out/apk-list.txt
          if [ ! -s out/apk-list.txt ]; then
            echo "No APK files were generated"
            exit 1
          fi
          while IFS= read -r apk; do
            base_name="$(basename "$apk")"
            cp "$apk" "out/${base_name}"
          done < out/apk-list.txt
          rm -f out/apk-list.txt
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pr-apks-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
